version: '3.8'

services:
  hc-jornada-t3:
    build:
      context: .
      dockerfile: DockerFile
    container_name: hc-jornada-t3
    restart: always
    expose:
      - "10000"
    volumes:
      - /var/app/hc-jornada-t3/data:/app/data:Z
    env_file:
      - /var/app/hc-jornada-t3/.env
    environment:
      - SQLITE_DSN=sqlite+aiosqlite:////app/data/app.db

  nginx:
    image: docker.io/library/nginx:alpine
    container_name: hc-jornada-t3-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/app/hc-jornada-t3/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - hc-jornada-t3
